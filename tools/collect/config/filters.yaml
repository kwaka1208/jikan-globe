# 子ども向けの除外ルール（HANDOFF 6.4）
# 除外したものは work/excluded.jsonl に理由付きで残す。
# 戦争や戦いそのものは歴史の授業でも扱うので外さない。

labels:
  # 日本語ラベルがないものを出すか（決定事項2：出さない）
  allow_english_only: false

# このクラス（下位クラスを含む）に当たるものは外す。P31 で判定する
# QIDは wbsearchentities で照合済み
exclude_classes:
  - { qid: Q3199915, label: 虐殺, verified: 2026-11-26 }
  - { qid: Q41397, label: ジェノサイド, verified: 2026-11-26 }
  - { qid: Q154278, label: 民族浄化, verified: 2026-11-26 }
  - { qid: Q177716, label: ポグロム, verified: 2026-11-26 }
  - { qid: Q2223653, label: テロ攻撃, verified: 2026-11-26 }
  - { qid: Q21480300, label: 銃乱射事件, verified: 2026-11-26 }
  - { qid: Q8454, label: 死刑, verified: 2026-11-26 }
  - { qid: Q10855380, label: 公開処刑, verified: 2026-11-26 }
  - { qid: Q132781, label: 拷問, verified: 2026-11-26 }
  - { qid: Q558075, label: 性暴力, verified: 2026-11-26 }
  - { qid: Q47092, label: 強姦, verified: 2026-11-26 }
  - { qid: Q119094, label: 人身供犠, verified: 2026-11-26 }
  - { qid: Q135010, label: 戦争犯罪, verified: 2026-11-26 }

# タイトルか Wikidata の日本語の説明に含まれていたら外す
exclude_words:
  - 虐殺
  - 大量殺
  - 殺戮
  - ジェノサイド
  - 民族浄化
  - テロ
  - 処刑
  - 斬首
  - 磔
  - 火刑
  - 拷問
  - 強姦
  - 性暴力
  - 性的暴行
  - 慰安
  - 人身御供
  - 生贄
  - 自爆
  - 乱射
  - 爆破事件
  # 殺人事件は「災害」の「大火」などの下位クラスから入ってくるが、災害ではないので外す
  - 殺人事件
  - 殺害事件
  - 放火殺人
  - 殺人放火
  - 殺人・放火
  # 放火事件も災害ではない。歴史の授業で扱うものは category_overrides で残す
  - 放火事件
  - 放火心中

# カテゴリを付け直すもの（QID → カテゴリ）。Wikidata のクラスからは「災害」に入ってしまうもの。
# ここにあるものは確認済みとして、除外語（exclude_words）では外さない
category_overrides:
  Q153992: { category: politics, label: ドイツ国会議事堂放火事件 }
  Q11616904: { category: politics, label: 英国公使館焼き討ち事件 }
  # 戦争の中での焼き討ちは「戦い・戦争」に
  Q65119236: { category: war, label: サザークの焼き討ち }
  Q4999914: { category: war, label: エディンバラ焼き討ち }
  Q198670: { category: war, label: ノーフォーク焼き討ち }
  Q897785: { category: war, label: モスクワ焼き討ち (1812年) }
  Q897786: { category: war, label: ワシントン焼き討ち }

# タイトルや説明に含まれていたら、外さずにレビュー一覧に出す（ぎりぎりのもの）
borderline_words:
  - 暗殺
  - 殺害
  - 殺人
  - 粛清
  - 弾圧
  - 迫害
  - 収容所
  - 捕虜
  - 自決
  - 切腹
  - 一揆
  - 事件

# Wikipediaの要約にこれらの語があれば、その要約は説明文に使わない
# （戦いの記事に残酷な描写が入るのを防ぐ。できごと自体は外さず、次の説明文の候補を使う）
text_exclude_words:
  - 虐殺
  - 殺戮
  - 処刑
  - 斬首
  - 拷問
  - 強姦
  - 性的
  - 遺体
  - 死体
  - 首を
  - 焼き殺
  - 皆殺

# 年がこれより後のもの（計画中の建物など）は外す
max_year: 2026
