# 取得するカテゴリとWikidataのクラス
# QIDは wbgetentities でラベルを照合済み（verified に照合日を書く）。
# 照合していない候補は verified を空にし、使う前に確認すること。

client:
  # Wikimediaの方針により User-Agent は必須。連絡先はここで変える
  user_agent: "jikan-no-chikyugi/0.1 (https://crssrds.jp/)"
  # 詳細（QIDを指定して取る軽いクエリ）は Wikidata 公式の WDQS
  sparql_endpoint: "https://query.wikidata.org/sparql"
  # 一覧（クラスで全件を探す重いクエリ）は QLever。WDQSでは建物などが60秒を超えるため（2026-11-26 判断）
  # 大学の公開サービスでSLAはなく、データは数日〜数週間前の写し。
  # WDQSに戻すときは engine: wdqs、endpoint を上の sparql_endpoint にする
  list_sparql:
    engine: qlever
    endpoint: "https://qlever.cs.uni-freiburg.de/api/wikidata"
  wikipedia_summary: "https://ja.wikipedia.org/api/rest_v1/page/summary/"
  concurrency: 1          # 同時実行数（1〜2）
  max_retries: 5          # 429/503 の再試行回数（Retry-After と指数バックオフ）
  wikipedia_rps: 3        # Wikipedia への毎秒リクエスト数の上限
  wikipedia_concurrency: 3  # Wikipedia への同時接続数（応答待ちが長いため）

# 時代の分割（クエリのタイムアウト対策）。from 以上 to 未満を step 年ごとに取る
# 年は 0年のない暦年（紀元前は負の数）
periods:
  - { from: -3500, to: 1500, step: 500 }
  - { from: 1500, to: 1800, step: 100 }
  - { from: 1800, to: 2030, step: 10 }

# 国の絞り込み。空にすると全世界
# （フェーズ1前半は日本・中国・台湾・韓国・北朝鮮・モンゴルに絞っていた。2026-11-26 に全世界へ）
scope:
  countries: []

# 「日本」とみなす主体。P710（参加者）にこれらを含むできごとは japan: link の候補にする
# （自動判定は候補止まり。レビューで確定する）
japan_entities:
  - { qid: Q17, label: 日本, verified: 2026-11-26 }
  - { qid: Q188712, label: 大日本帝国, verified: 2026-11-26 }
  - { qid: Q276535, label: 大日本帝国陸軍, verified: 2026-11-26 }
  - { qid: Q219712, label: 大日本帝国海軍, verified: 2026-11-26 }
  - { qid: Q736839, label: 鎌倉幕府, verified: 2026-11-26 }
  - { qid: Q1154406, label: 室町幕府, verified: 2026-11-26 }
  - { qid: Q11634225, label: 豊臣政権, verified: 2026-11-26 }
  - { qid: Q205662, label: 江戸幕府, verified: 2026-11-26 }
  - { qid: Q275488, label: 自衛隊, verified: 2026-11-26 }
  - { qid: Q1378053, label: 倭, verified: 2026-11-26 }
  - { qid: Q2658252, label: ヤマト王権, verified: 2026-11-26 }
  - { qid: Q6139796, label: 日本軍, verified: 2026-11-26 }

categories:
  war:
