    label_en: "Wars & battles"
    enabled: true
    # 日付は P585（時点）→ P580（開始）の順。終わりは P582
    date_props: [P585, P580]
    end_props: [P582]
    classes:
      - { qid: Q178561, label: 戦闘, verified: 2026-11-26 }
      - { qid: Q198, label: 戦争, verified: 2026-11-26 }
    subclasses: true      # P279* で下位クラスもたどる

  building:
