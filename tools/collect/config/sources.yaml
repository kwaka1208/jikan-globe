    subclasses: true
    # 上のクラスに当たらなくても、世界遺産（P1435 = Q9259）なら取る
    heritage:
      - { qid: Q9259, label: 世界遺産, verified: 2026-11-26 }

  # --- フェーズ1後半で追加（QIDは 2026-11-26 に wbgetentities で再照合） ---
  # 日本語ラベルのないものは一覧の段階で外す（fetch.js の itemFilter）。
  # min_sitelinks を書くと、sitelink数がそれ未満のものも一覧の段階で外す
  politics:
    label: 国・政治
    label_en: "Nations & politics"
    enabled: true
    date_props: [P585, P580, P571]
    end_props: [P582, P576]
    classes:
      - { qid: Q131569, label: 条約, verified: 2026-11-26 }
      - { qid: Q10931, label: 革命, verified: 2026-11-26 }
      - { qid: Q45382, label: クーデター, verified: 2026-11-26 }
      - { qid: Q1464916, label: 独立宣言, verified: 2026-11-26 }
      - { qid: Q3024240, label: かつて存在した国家, verified: 2026-11-26 }
