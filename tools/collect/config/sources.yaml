      - { qid: Q7692360, label: 噴火, verified: 2026-11-26 }
      - { qid: Q8070, label: 津波, verified: 2026-11-26 }
      - { qid: Q8092, label: 熱帯低気圧, verified: 2026-11-26 }
      - { qid: Q12184, label: パンデミック, verified: 2026-11-26 }
      - { qid: Q8068, label: 洪水, verified: 2026-11-26 }
      - { qid: Q168983, label: 大火, verified: 2026-11-26 }
    subclasses: true

  sports_culture:
    label: スポーツ・文化
    label_en: "Sports & culture"
    enabled: true
    date_props: [P585, P580]
    end_props: [P582]
    classes:
      - { qid: Q159821, label: 夏季オリンピック, verified: 2026-11-26 }
      - { qid: Q82414, label: 冬季オリンピック, verified: 2026-11-26 }
